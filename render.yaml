services:
  - type: web
    name: goalstream-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: flask --app backend.app db upgrade && gunicorn --bind 0.0.0.0:$PORT backend.app:app
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: CLIENT_URL
        fromService:
          type: web
          name: goalstream-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: goalstream-db
          property: connectionString
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: RATELIMIT_STORAGE_URI
        fromService:
          type: keyvalue
          name: goalstream-rate-limits
          property: connectionString
      - key: FOOTBALL_PROVIDER
        value: matchora

  - type: web
    name: goalstream-web
    runtime: static
    buildCommand: npm ci && npm run build -w client
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: goalstream-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: keyvalue
    name: goalstream-rate-limits
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: goalstream-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []
